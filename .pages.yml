media:
  input: public/uploads/noticias
  output: /uploads/noticias
  rename: safe

content:
  - name: noticias
    label: Notícias
    type: collection
    path: src/content/noticias
    format: yaml-frontmatter
    filename: "{primary}.mdoc"
    view:
      primary: titulo
      sort: data
      order: desc
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: data
        label: Data
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: resumo
        label: Resumo
        type: text
        description: Texto curto de introdução (opcional). Se omitido, o resumo é extraído do conteúdo.
      - name: imagem
        label: Imagem de capa
        type: image
      # Manter opções em sincronia com src/data/categorias.ts
      - name: categorias
        label: Categorias
        type: select
        default:
          - noticia
        options:
          multiple: true
          values:
            - name: noticia
              label: Notícia
            - name: reflexao
              label: Reflexão
            - name: entrevista
              label: Entrevista
            - name: cronica
              label: Crônica
            - name: review
              label: Review
      - name: body
        label: Conteúdo
        type: rich-text
        options:
          format: markdown
